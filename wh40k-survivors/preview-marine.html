<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Space Marine Preview</title>
  <style>
    body { background:#1a1a2e; display:flex; flex-wrap:wrap; gap:32px;
           padding:32px; font-family:monospace; color:#fff; align-items:flex-start; }
    .box { display:flex; flex-direction:column; align-items:center; gap:10px; }
    canvas { image-rendering:pixelated; border:2px solid #444; background:#333a55; }
    label  { font-size:13px; color:#aaa; text-align:center; }
    img.ref { border:2px solid #ffd700; image-rendering:pixelated; }
    h3 { color:#ffd700; margin:0; font-size:14px; }
  </style>
</head>
<body>

<div class="box">
  <h3>📷 원본 크롭</h3>
  <img class="ref" src="./assets/marine.png" style="width:148px;">
</div>

<div id="previews"></div>

<script>
// ── 배경 제거 후 offscreen canvas 생성 ──────────────────────
function buildMarineCanvas(img, tolerance) {
  const W = img.naturalWidth, H = img.naturalHeight;
  const oc = document.createElement('canvas');
  oc.width = W; oc.height = H;
  const c  = oc.getContext('2d');
  c.drawImage(img, 0, 0);

  const id   = c.getImageData(0, 0, W, H);
  const data = id.data;
  const bgR  = data[0], bgG = data[1], bgB = data[2];

  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i+1], b = data[i+2];
    if (Math.abs(r-bgR) + Math.abs(g-bgG) + Math.abs(b-bgB) < tolerance)
      { data[i+3] = 0; continue; }
    // 빨강/주황 폭발 파티클 제거
    if (r > 160 && r - g > 80 && r - b > 80) data[i+3] = 0;
  }
  c.putImageData(id, 0, 0);
  return oc;
}

// ── 렌더 함수 ───────────────────────────────────────────────
function renderOnCanvas(marineCanvas, r, flash, label) {
  const SIZE = r * 6;
  const cv   = document.createElement('canvas');
  cv.width   = SIZE; cv.height = SIZE;
  const ctx  = cv.getContext('2d');

  // 배경
  ctx.fillStyle = '#3a3050'; ctx.fillRect(0, 0, SIZE, SIZE);

  // 그림자
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(SIZE/2, SIZE/2 + r*0.9, r*0.7, r*0.2, 0, 0, Math.PI*2);
  ctx.fill();

  // 충돌 원 (반투명 표시)
  ctx.strokeStyle = 'rgba(255,255,0,0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(SIZE/2, SIZE/2, r, 0, Math.PI*2); ctx.stroke();

  ctx.save();
  ctx.translate(SIZE/2, SIZE/2);

  const scale = (r * 3.64) / marineCanvas.height;
  const dw = marineCanvas.width  * scale;
  const dh = marineCanvas.height * scale;

  if (flash) ctx.filter = 'brightness(4) saturate(0.2)';
  ctx.drawImage(marineCanvas, -dw/2, -dh/2, dw, dh);
  ctx.filter = 'none';
  ctx.restore();

  const box = document.createElement('div'); box.className = 'box';
  const lbl = document.createElement('label'); lbl.textContent = label;
  box.appendChild(lbl); box.appendChild(cv);
  document.getElementById('previews').appendChild(box);
}

// ── 좌우 반전 버전 ───────────────────────────────────────────
function renderFlipped(marineCanvas, r, label) {
  const SIZE = r * 6;
  const cv   = document.createElement('canvas');
  cv.width   = SIZE; cv.height = SIZE;
  const ctx  = cv.getContext('2d');

  ctx.fillStyle = '#3a3050'; ctx.fillRect(0, 0, SIZE, SIZE);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(SIZE/2, SIZE/2+r*0.9, r*0.7, r*0.2, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.save();
  ctx.translate(SIZE/2, SIZE/2);
  ctx.scale(-1, 1);   // ← 왼쪽 이동 시 flip

  const scale = (r * 3.64) / marineCanvas.height;
  const dw = marineCanvas.width  * scale;
  const dh = marineCanvas.height * scale;
  ctx.drawImage(marineCanvas, -dw/2, -dh/2, dw, dh);
  ctx.restore();

  const box = document.createElement('div'); box.className = 'box';
  const lbl = document.createElement('label'); lbl.textContent = label;
  box.appendChild(lbl); box.appendChild(cv);
  document.getElementById('previews').appendChild(box);
}

// ── 허용 오차 슬라이더 ───────────────────────────────────────
const sliderBox = document.createElement('div');
sliderBox.style = 'width:100%;color:#ffd700;font-size:13px;display:flex;gap:12px;align-items:center;';
sliderBox.innerHTML = `
  배경 제거 강도:
  <input id="tol" type="range" min="30" max="200" value="90" style="width:200px">
  <span id="tolVal">90</span>
  <button id="reloadBtn" style="background:#444;color:#fff;border:1px solid #888;padding:4px 12px;cursor:pointer;">적용</button>
`;
document.body.insertBefore(sliderBox, document.getElementById('previews'));

// ── 메인 로직 ───────────────────────────────────────────────
const img = new Image();
img.onload = () => {
  function rebuild() {
    const tol = parseInt(document.getElementById('tol').value);
    document.getElementById('tolVal').textContent = tol;
    document.getElementById('previews').innerHTML = '';
    const mc = buildMarineCanvas(img, tol);
    renderOnCanvas(mc,  14, false, 'r=14 (게임 실제)');
    renderOnCanvas(mc,  20, false, 'r=20 (확대)');
    renderOnCanvas(mc,  28, false, 'r=28 (더 크게)');
    renderFlipped (mc,  20,        'r=20 ← 왼쪽 이동');
    renderOnCanvas(mc,  20, true,  'r=20 히트 플래시');
  }

  document.getElementById('tol').addEventListener('input', () => {
    document.getElementById('tolVal').textContent = document.getElementById('tol').value;
  });
  document.getElementById('reloadBtn').addEventListener('click', rebuild);
  rebuild();
};
img.onerror = () => {
  document.getElementById('previews').innerHTML =
    '<p style="color:red">❌ assets/marine.png 로드 실패 — 경로 확인 필요</p>';
};
img.src = './assets/marine.png';
</script>
</body>
</html>
